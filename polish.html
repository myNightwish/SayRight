<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0b1a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Nuance · 语差</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* 手机网页版：popup 在浏览器里是固定小宽度，这里放开成自适应全屏。
         styles.css 给扩展弹窗写死了 body{width:460px}，网页版必须覆盖掉，否则整页锁死成窄栏。 */
      html, body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        /* 用 clip 而非 hidden：只裁掉横向溢出（背景流光），
           不会把 html/body 变成滚动容器——用 hidden 会让 overflow-y 被强制算成 auto，
           html 和 body 都成了滚动容器，桌面端整页就滚不动了。 */
        overflow-x: clip;
        overscroll-behavior-y: none;   /* 禁掉下拉回弹，去掉「网页划来划去」的感觉 */
      }
      .app {
        max-width: 640px;
        width: 100%;
        margin: 0 auto;              /* 宽屏时居中，窄屏时占满 */
        min-height: 100vh;
        box-sizing: border-box;
        padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      }
      .aurora { inset: -30% -10% auto -10%; }
      /* 触摸友好：输入框和按钮在手机上更高、字更大，避免 iOS 聚焦时自动放大 */
      .textarea { min-height: 120px; font-size: 16px; }
      .scene-select { font-size: 16px; padding: 8px 12px; }
      .button { padding: 10px 24px; font-size: 16px; }
      .result-text { font-size: 15px; }
      /* 每组「标签+下拉」的容器；宽屏时横向自适应，窄屏时纵向堆叠 */
      .expression-settings,
      .expression-settings-sheet { display: contents; }
      .expression-settings-head,
      .expression-settings-trigger { display: none; }
      .scene-row .scene-field { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; }
      .scene-row .scene-field .scene-select { flex: 1; }
      .polish-assistant {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 46px;
        margin: -3px 0 9px;
        padding: 4px 8px 4px 4px;
        border-radius: 14px;
        background: rgba(124,92,255,0.06);
      }
      .polish-assistant img {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        object-fit: contain;
        border-radius: 12px;
      }
      .polish-assistant strong {
        display: block;
        color: var(--violet-deep);
        font-size: 12px;
        line-height: 1.3;
      }
      .polish-assistant span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }
      /* 窄屏（手机）：整体放松间距，去掉「挤」的观感 */
      @media (max-width: 768px) {
        .app {
          display: flex;
          flex-direction: column;
        }
        .brand .brand-collection { display: none; }
        .brand { order: 0; }
        .polish-result-panel { order: 1; }
        #memoRow { order: 2; }
        .stars-row { order: 3; }
        .polish-input-panel {
          order: 4;
          margin-top: auto;
        }
        .expression-settings-trigger {
          min-width: 92px;
          max-width: 122px;
          height: 44px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 5px;
          padding: 0 10px;
          overflow: hidden;
          border: 1px solid rgba(124,92,255,0.18);
          border-radius: 13px;
          background: rgba(255,255,255,0.72);
          color: var(--violet-deep);
          font-size: 12px;
          font-weight: 800;
          white-space: nowrap;
          text-overflow: ellipsis;
        }
        .expression-settings {
          position: fixed;
          z-index: 1200;
          inset: 0;
          display: flex;
          align-items: flex-end;
          padding: 16px 14px calc(18px + env(safe-area-inset-bottom));
          background: rgba(25,20,45,0.28);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.18s ease;
        }
        .expression-settings.is-open {
          opacity: 1;
          pointer-events: auto;
        }
        .expression-settings-sheet {
          width: 100%;
          display: block;
          padding: 14px;
          border: 1px solid rgba(255,255,255,0.84);
          border-radius: 20px;
          background: rgba(252,251,255,0.97);
          box-shadow: 0 18px 46px rgba(48,30,105,0.28);
          backdrop-filter: blur(20px) saturate(160%);
          transform: translateY(12px);
          transition: transform 0.18s ease;
        }
        .expression-settings.is-open .expression-settings-sheet { transform: translateY(0); }
        .expression-settings-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 12px;
          color: var(--ink);
          font-size: 15px;
          font-weight: 800;
        }
        .expression-settings-close {
          width: 32px;
          height: 32px;
          border: 0;
          border-radius: 10px;
          background: rgba(124,92,255,0.08);
          color: var(--violet-deep);
          font-size: 19px;
        }
        .expression-settings .scene-row {
          display: grid;
          grid-template-columns: 1fr;
          gap: 10px;
          margin: 0;
        }
        .expression-settings .scene-field {
          display: grid;
          grid-template-columns: 58px minmax(0, 1fr);
          align-items: center;
          gap: 10px;
        }
        .expression-settings .scene-select { width: 100%; }
        .action-row {
          display: grid;
          grid-template-columns: auto minmax(0, 0.9fr) minmax(0, 1.2fr);
          align-items: center;
        }
        .action-row .direction-hint { grid-column: 1 / -1; }
      }
      @media (max-width: 560px) {
        .app { padding: 12px 14px calc(16px + env(safe-area-inset-bottom)); }
        .panel { padding: 16px; border-radius: 20px; margin-bottom: 14px; }
        .textarea { min-height: 132px; }
        .expression-settings .scene-row { gap: 10px; margin: 0; }
        .expression-settings .scene-field {
          display: grid;
          grid-template-columns: 58px minmax(0, 1fr);
          align-items: center;
          gap: 10px;
        }
        .expression-settings .scene-label { font-size: 12px; }
        .expression-settings .scene-select { width: 100%; }
        .action-row { margin-top: 14px; gap: 8px; }
        .action-row .button { min-width: 0; padding: 10px 12px; }
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <main class="app">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="nuanceGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7c5cff"/>
                <stop offset="1" stop-color="#c44bff"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#nuanceGrad)"/>
            <path d="M10 22V10l12 12V10" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Nuance</span>
        <span class="brand-zh">语差</span>
        <a id="openCollection" class="collection-link brand-collection" href="collection.html">我的收藏 ›</a>
        <a id="openScene" class="collection-link brand-collection" href="scene.html">场景预演 ›</a>
        <a id="openTalk" class="collection-link brand-collection" href="chat.html?talk=1">日常对练 ›</a>
        <a id="openRehearse" class="collection-link brand-collection" href="chat.html?rehearse=1">情景对练 ›</a>
      </div>

      <section class="panel polish-input-panel" aria-label="翻译输入">
        <div id="polishAssistant" class="polish-assistant" aria-live="polite">
          <img id="polishAssistantImage" src="images/mascot-study-v2.png" alt="Coco 正在陪你练习表达" />
          <div>
            <strong id="polishAssistantTitle">把想说的直接写下来</strong>
            <span id="polishAssistantStatus">中英文都可以，我会结合场景处理。</span>
          </div>
        </div>
        <textarea
          id="sourceText"
          class="textarea"
          rows="3"
          placeholder="用英文说一句话，练习地道表达......"
        ></textarea>

        <div id="expressionSettings" class="expression-settings" aria-label="表达设置">
          <div class="expression-settings-sheet" aria-labelledby="expressionSettingsTitle">
            <div class="expression-settings-head">
              <span id="expressionSettingsTitle">表达设置</span>
              <button id="closeExpressionSettings" class="expression-settings-close" type="button" aria-label="关闭">×</button>
            </div>
            <div class="scene-row">
          <div class="scene-field">
            <label class="scene-label" for="sceneSelect">场景</label>
            <select id="sceneSelect" class="scene-select">
              <option value="">通用</option>
              <option value="面试">面试</option>
              <option value="客户沟通">客户沟通</option>
              <option value="向老板汇报">向老板汇报</option>
              <option value="恋爱聊天">恋爱聊天</option>
              <option value="论文写作">论文写作</option>
              <option value="工作邮件">工作邮件</option>
            </select>
          </div>
          <div class="scene-field">
            <label class="scene-label" for="toneSelect">语气</label>
            <select id="toneSelect" class="scene-select">
              <option value="">自然</option>
              <option value="礼貌">礼貌</option>
              <option value="专业">专业</option>
              <option value="友好">友好</option>
              <option value="热情">热情</option>
              <option value="强势">强势</option>
              <option value="简洁">简洁</option>
              <option value="委婉">委婉</option>
            </select>
          </div>
          <div class="scene-field">
            <label class="scene-label" for="strictnessSelect">严格度</label>
            <select id="strictnessSelect" class="scene-select">
              <option value="strict">严格挑剔</option>
              <option value="easy">鼓励务实</option>
            </select>
          </div>
            </div>
          </div>
        </div>

        <div class="action-row">
          <span id="directionBadge" class="direction-hint"></span>
          <button id="openExpressionSettings" class="expression-settings-trigger" type="button" aria-haspopup="dialog" aria-controls="expressionSettings">
            <span aria-hidden="true">⚙</span>
            <span id="expressionSettingsSummary">通用 · 自然 · 严格</span>
          </button>
          <button id="translateButton" class="button button-primary" type="button">翻译</button>
          <button id="tutorButton" class="button button-accent" type="button">说的对吗？</button>
        </div>
      </section>

      <!-- 记忆提示：夹在输入卡和结果卡之间，出结果后才显示。
           放这里手机端不用滑到最底就能填，且它本就是收藏时的题面锚点。
           一个精简小标题引导，详细用途留在 placeholder。 -->
      <div id="memoRow" class="memo-row" hidden>
        <label class="memo-label" for="memoInput">🧠 记忆提示 · 让复习更贴合</label>
        <input id="memoInput" class="memo-input" type="text" autocomplete="off"
          placeholder="什么情境下你想说这句（选填）？…" />
      </div>

      <!-- 星级：0=只收进接收库；1–5=晋升进产出核心，星越多越高频，练习/对练优先。
           点星隐含收藏，polish 当下即可直接标核心。收藏页仍可再改。 -->
      <div class="stars-row" hidden>
        <span class="stars-label">⭐ 核心度</span>
        <div id="starsPicker" class="stars-picker"></div>
      </div>

      <section class="panel result-panel polish-result-panel" aria-label="输出结果">
        <div class="result-head">
          <span class="result-label">结果</span>
          <div class="result-tools">
            <button id="saveButton" class="tool-btn tool-save" type="button" title="收藏这条润色" hidden>☆ 收藏</button>
            <button id="copyButton" class="tool-btn tool-copy" type="button" title="复制" disabled>⧉ 复制</button>
          </div>
        </div>
        <div id="resultText" class="result-text" aria-live="polite">
          翻译或润色结果......
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="sync.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
